<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 640" width="2400" height="640">
  <!-- 柔和暖象牙灰白背景 (Warm Ivory/Paper Tint) -->
  <rect width="100%" height="100%" fill="#F4F3EE" rx="48" />
  
  <!-- 居中组合容器：左右留白 316px，上下留白 164px -->
  <g transform="translate(316, 164)">
    
    <!-- 左侧：The Threaded Strata 图标 (保持原样) -->
    <g id="zymor-icon">
      <!-- L0 Event Stream -->
      <rect x="0" y="240" width="320" height="72" rx="16" fill="#1A2242" />
      
      <!-- L2 Session Capsule -->
      <rect x="0" y="120" width="320" height="72" rx="16" fill="#2D3A6B" />
      
      <!-- L4 Persona Facets -->
      <rect x="0" y="0" width="320" height="72" rx="16" fill="#465A9E" />
      
      <!-- Dream Engine Thread -->
      <path d="M 56 276 L 264 276 L 264 156 L 56 156 L 56 36 L 264 36" fill="none" stroke="#8B9FF0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
            
      <!-- Knowledge Node -->
      <circle cx="264" cy="36" r="24" fill="#8B9FF0" />
    </g>

    <!-- 右侧：柔和深矿物靛灰色字标 (深灰中透出微微冷调，不刺眼) -->
    <text x="460" y="280" fill="#232B3E" font-family="system-ui, -apple-system, &#39;Inter&#39;, &#39;Montserrat&#39;, &#39;Helvetica Neue&#39;, sans-serif" font-size="320" font-weight="900" letter-spacing="0.06em">
      ZYMOR
    </text>
    
  </g>
</svg>