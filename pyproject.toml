[project]
name = "zymor"
version = "0.2.1"
description = "The dreaming memory system for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Zymor contributors" }]
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = ["numpy>=1.26", "backoff>=2.2", "tqdm>=4.66", "httpx>=0.28"]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.6", "types-PyYAML>=6.0"]

[project.scripts]
zymor = "zymor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zymor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["zymor"]
mypy_path = "src"
